# The gates, run on every push and pull request (ROADMAP D3).
#
# Every step is a script from `package.json`, so CI cannot drift from what a
# developer runs — the alternative, spelling the commands out here, is two lists
# that have to be kept in step by hand and silently disagree the first time
# someone forgets.
#
# `test:coverage` is a separate step rather than part of `ci` so the coverage
# table appears in the log where a reviewer can see it, and so a threshold failure
# is attributable to coverage rather than to the test run.
#
# It earned its place on its first run: typecheck failed on a clean checkout
# because `.gitignore` was excluding `apps/web/src/data/`, nine source files that
# were present locally and therefore invisible to a local check. See the
# `.gitignore` comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Matches `packageManager` in the root package.json. A different Bun
          # would be a different `bun:sqlite`, and the persistence tests assert
          # driver behaviour rather than mocking it.
          bun-version: 1.4.2

      # `--frozen-lockfile` so a dependency added locally but not committed fails
      # here rather than resolving to something nobody chose.
      - name: Install
        run: bun install --frozen-lockfile

      # The automation tests drive a real Chromium against a local fixture, which
      # is the only way to test a sign-in flow — a mocked browser would test the
      # mock. A runner has no browsers cached, so they are fetched here.
      #
      # Run from the worker's own directory so `playwright` resolves to the
      # version the lockfile pins. From the root, `bunx playwright` finds no local
      # copy and downloads whatever is latest instead.
      - name: Install the browser the automation tests drive
        working-directory: tools/automation-worker
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The gate NFR-2 is measured by. Fails below 85% lines on apps/server/src.
      - name: Coverage
        run: bun run test:coverage

      # The console and the standalone binary both have to build. A typecheck does
      # not catch a bundling failure, and the binary is what a distribution is.
      - name: Build
        run: bun run build
